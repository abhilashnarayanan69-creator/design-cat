<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photo Restoration | DESIGN CAT</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    margin:0;
    background:#050505;
    color:#fff;
    font-family:Arial, sans-serif;
}

header{
    padding:25px;
    text-align:center;
    border-bottom:1px solid #3b2a00;
}

.logo{
    width:150px;
}

h1{
    color:#f5b82e;
    margin-top:30px;
    font-size:38px;
}

.subtitle{
    color:#ccc;
    margin-bottom:35px;
}

.gallery{
    width:90%;
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
    padding-bottom:60px;
}

.card{
    border:1px solid #8a6200;
    border-radius:10px;
    padding:10px;
    background:#090909;
    box-shadow:0 0 15px rgba(212,160,23,.15);
}

.card img{
    width:100%;
    display:block;
    border-radius:6px;
}

.back{
    display:inline-block;
    margin:20px;
    padding:12px 22px;
    border:1px solid #d49b19;
    color:#f5b82e;
    text-decoration:none;
    border-radius:5px;
}

@media(max-width:800px){
    .gallery{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){
    .gallery{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <img src="design-cat-logo.jpg" alt="DESIGN CAT Logo" class="logo">

    <h1>Photo Restoration</h1>

    <p class="subtitle">
        Old, damaged and faded photographs restored with a clean, natural finish.
    </p>
</header>

<a href="index.html" class="back">← Back to Home</a>

<div class="gallery">

    <div class="card">
        <img src="photo-restoration-1.jpg.jpg" alt="Photo Restoration 1">
    </div>

    <div class="card">
        <img src="photo-restoration-2.jpg.jpg" alt="Photo Restoration 2">
    </div>

    <div class="card">
        <img src="photo-restoration-3.jpg.jpg" alt="Photo Restoration 3">
    </div>

    <div class="card">
        <img src="photo-restoration-4.jpg.jpg" alt="Photo Restoration 4">
    </div>

    <div class="card">
        <img src="photo-restoration-5.jpg.jpg" alt="Photo Restoration 5">
    </div>

    <div class="card">
        <img src="photo-restoration-6.jpg.jpg" alt="Photo Restoration 6">
    </div>

    <div class="card">
        <img src="photo-restoration-7.jpg.jpg" alt="Photo Restoration 7">
    </div>

    <div class="card">
        <img src="photo-restoration-8.jpg.jpg" alt="Photo Restoration 8">
    </div>

    <div class="card">
        <img src="photo-restoration-9.jpg.jpg" alt="Photo Restoration 9">
    </div>

    <div class="card">
        <img src="photo-restoration-10.jpg.jpg" alt="Photo Restoration 10">
    </div>

</div>

</body>
</html>
